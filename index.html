<script>
// ---------- offline support ----------
(function () {
  function toast(msg, ms) {
    var t = document.getElementById("offlineToast");
    if (!t) return;
    t.textContent = msg; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, ms || 3000);
  }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (e) {
        console.log("SW registration failed", e);
      });
      navigator.serviceWorker.addEventListener("message", function (ev) {
        if (ev.data && ev.data.type === "precache") {
          if (ev.data.cached >= ev.data.total) {
            toast("Saved for offline use ✓", 3500);
          } else {
            toast("Partly saved offline (" + ev.data.cached + "/" + ev.data.total + ")", 4000);
          }
        }
      });
    });
  }
  window.addEventListener("offline", function () { toast("Offline — app still works", 2500); });
})();
</script>

async function tryStorageSet(key, value) {
  if (!window.storage) return false;
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      const r = attempt % 2 === 0
        ? await window.storage.set(key, value, false)
        : await window.storage.set(key, value);
      if (r) return true;
    } catch {}
    await new Promise((res) => setTimeout(res, 300 * (attempt + 1)));
  }
  return false;
}
async function tryStorageGet(key) {
  if (!window.storage) return null;
  let r = null;
  try { r = await window.storage.get(key, false); }
  catch { try { r = await window.storage.get(key); } catch {} }
  return r && r.value ? r.value : null;
}

function saveOrderAsPDF(order) {
  const html = buildWorkOrderHTML(order);
  const w = window.open("", "_blank");
  if (!w) {
    // Popup blocked: write into a hidden iframe and print that.
    const frame = document.createElement("iframe");
    frame.style.position = "fixed"; frame.style.right = "0"; frame.style.bottom = "0";
    frame.style.width = "0"; frame.style.height = "0"; frame.style.border = "0";
    document.body.appendChild(frame);
    const doc = frame.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    setTimeout(() => { frame.contentWindow.focus(); frame.contentWindow.print(); }, 400);
    return;
  }
  w.document.open(); w.document.write(html); w.document.close();
  setTimeout(() => { w.focus(); w.print(); }, 500);
}


// ---------- Signature pad (compact JPEG) ----------
function SignaturePad({ onChange, height = 150 }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const hasInk = useRef(false);
  const onChangeRef = useRef(onChange);
  onChangeRef.current = onChange;

  const fillWhite = (canvas) => {
    const ctx = canvas.getContext("2d");
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  };

  useEffect(() => {
    const canvas = canvasRef.current;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    fillWhite(canvas);
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#1a1a5e";

    const pos = (e) => {
      const r = canvas.getBoundingClientRect();
      const p = (e.touches && e.touches.length ? e.touches[0] : e);
      return { x: p.clientX - r.left, y: p.clientY - r.top };
    };
    const start = (e) => {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
      drawing.current = true;
      const c = canvas.getContext("2d");
      const { x, y } = pos(e);
      c.beginPath();
      c.moveTo(x, y);
    };
    const move = (e) => {
      if (!drawing.current) return;
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
      const c = canvas.getContext("2d");
      const { x, y } = pos(e);
      c.lineTo(x, y);
      c.stroke();
      hasInk.current = true;
    };
    const end = (e) => {
      if (!drawing.current) return;
      if (e.cancelable) e.preventDefault();
      drawing.current = false;
      if (hasInk.current) onChangeRef.current(canvas.toDataURL("image/jpeg", 0.5));
    };

    // Native non-passive listeners: React's synthetic touch events are passive,
    // so preventDefault() there can't stop iOS from scrolling the page on a
    // downward stroke. These can.
    canvas.addEventListener("touchstart", start, { passive: false });
    canvas.addEventListener("touchmove", move, { passive: false });
    canvas.addEventListener("touchend", end, { passive: false });
    canvas.addEventListener("touchcancel", end, { passive: false });
    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    return () => {
      canvas.removeEventListener("touchstart", start);
      canvas.removeEventListener("touchmove", move);
      canvas.removeEventListener("touchend", end);
      canvas.removeEventListener("touchcancel", end);
      canvas.removeEventListener("mousedown", start);
      canvas.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", end);
    };
  }, []);

  const clear = () => {
    const canvas = canvasRef.current;
    fillWhite(canvas);
    hasInk.current = false;
    onChange(null);
  };

  return (
    <div>
      <div className="relative overflow-hidden"
           style={{ background: "#FFF", borderRadius: "12px", border: `1px solid ${C.sep}`, touchAction: "none", overscrollBehavior: "none" }}>
        <canvas
          ref={canvasRef} className="w-full block"
          style={{ height: height + "px", touchAction: "none", WebkitUserSelect: "none", userSelect: "none" }}
        />
        <div className="absolute left-5 right-5 pointer-events-none"
             style={{ bottom: "26px", borderBottom: `1px dashed ${C.tertiary}` }} />
        <span className="absolute pointer-events-none text-xs"
              style={{ bottom: "8px", left: "20px", color: C.tertiary }}>
          Sign above the line
        </span>
      </div>
      <button onClick={clear} className="mt-2 text-sm font-medium" style={{ color: C.tint }}>
        Clear
      </button>
    </div>
  );
}

  const [currentId, setCurrentId] = useState(null);
  const [openSection, setOpenSection] = useState("visual");
  const [custSig, setCustSig] = useState(null);
  const [techSig, setTechSig] = useState(null);
  const [signerName, setSignerName] = useState("");
  const [error, setError] = useState("");
  const [qb, setQb] = useState({ state: "idle", msg: "" });
  const [storageOk, setStorageOk] = useState(true);
  const [importText, setImportText] = useState("");
  const [copied, setCopied] = useState(false);

  const current = orders.find((o) => o.id === currentId) || null;

  useEffect(() => {
    (async () => {
      const raw = await tryStorageGet(DATA_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.orders)) setOrders(sortOrders(parsed.orders));
        } catch {}
      }
      setLoading(false);
    })();
  }, []);

  // Save to state immediately; try storage in the background (never blocks).
  const commit = (nextOrders) => {
    const sorted = sortOrders(nextOrders);
    setOrders(sorted);
    tryStorageSet(DATA_KEY, JSON.stringify({ orders: sorted })).then((ok) => {
      setStorageOk(ok);
    });
    return sorted;
  };

  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const setCheckTo = (section, item, val) => {
    const key = section + "|" + item;
    const checks = { ...form.checks };
    if (checks[key] === val) delete checks[key]; else checks[key] = val;
    setForm({ ...form, checks });
  };
  const markSectionOK = (sec) => {
    const checks = { ...form.checks };
    sec.items.forEach((it) => { const k = sec.key + "|" + it; if (!checks[k]) checks[k] = "OK"; });
    setForm({ ...form, checks });
  };
  const addPart = () => setForm({ ...form, parts: [...form.parts, { qty: "", name: "" }] });
  const setPart = (i, k, v) =>
    setForm({ ...form, parts: form.parts.map((p, j) => (j === i ? { ...p, [k]: v } : p)) });
  const removePart = (i) => setForm({ ...form, parts: form.parts.filter((_, j) => j !== i) });

  const startNew = (type) => {
    setForm(emptyForm); setFormType(type); setEditingId(null);
    setError(""); setOpenSection("visual"); setView("form");
  };
  const openOrder = (id) => {
    setCurrentId(id); setQb({ state: "idle", msg: "" }); setView("detail");
  };

  const save = (goSign) => {
    if (!form.customer.trim()) { setError("Company name is required."); return; }
    setError("");
    let order, nextOrders;
    if (editingId) {
      const existing = orders.find((o) => o.id === editingId);
      order = { ...existing, ...form };
      nextOrders = orders.map((o) => (o.id === editingId ? order : o));
    } else {
      order = {
        id: String(Date.now()), type: formType, number: nextNumber(orders, formType),
        createdAt: new Date().toISOString(), status: "draft", ...form,
      };
      nextOrders = [order, ...orders];
    }
    commit(nextOrders);
    setCurrentId(order.id);
    if (goSign) { setCustSig(null); setTechSig(null); setSignerName(""); setView("sign"); }
    else setView("list");
  };

  const completeSigning = () => {
    if (!custSig) { setError("A customer signature is required."); return; }
    setError("");
    const order = {
      ...current, status: "signed",
      signature: custSig, technicianSignature: techSig,
      signerName: signerName.trim(), signedAt: new Date().toISOString(),
    };
    commit(orders.map((o) => (o.id === order.id ? order : o)));
    setQb({ state: "idle", msg: "" });
    setView("detail");
  };

  const editDraft = () => {
    const f = { ...emptyForm };
    Object.keys(emptyForm).forEach((k) => { if (current[k] !== undefined) f[k] = current[k]; });
    setForm(f);
    setFormType(current.type || "repair");
    setEditingId(current.id);
    setError("");
    setView("form");
  };

  const removeOrder = () => {
    commit(orders.filter((o) => o.id !== current.id));
    setCurrentId(null);
    setView("list");
  };

  const savePDF = () => {
    try { saveOrderAsPDF(current); }
    catch (e) { setQb({ state: "error", msg: "Couldn't open the PDF view. Try again." }); }
  };

  const copyBackup = async () => {
    const text = JSON.stringify({ orders }, null, 2);
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch {
      setImportText(text); // fall back to showing it so they can select-all copy
    }
  };
  const restoreBackup = () => {
    try {
      const parsed = JSON.parse(importText);
      if (Array.isArray(parsed.orders)) {
        commit(parsed.orders);
        setImportText("");
        setView("list");
      } else {
        setError("That backup didn't contain any work orders.");
      }
    } catch {
      setError("Couldn't read that backup text. Paste the full backup and try again.");
    }
  };

  const NavBar = ({ title, back }) => (
    <div className="sticky top-0 z-10"
         style={{ background: "rgba(242,242,247,0.92)", backdropFilter: "blur(12px)", borderBottom: `0.5px solid ${C.sep}` }}>
      <div className="max-w-2xl mx-auto px-2 h-11 flex items-center relative">
        {back && (
          <button onClick={back} className="flex items-center text-base active:opacity-50" style={{ color: C.tint }}>
            <ChevronLeft size={24} strokeWidth={2.5} />
            <span className="-ml-0.5">Back</span>
          </button>
        )}
        <span className="absolute left-1/2 -translate-x-1/2 text-base font-semibold truncate max-w-[55%]" style={{ color: C.label }}>
          {title}
        </span>
      </div>
    </div>
  );

  const StorageBanner = () => storageOk ? null : (
    <button onClick={() => { setError(""); setImportText(""); setView("backup"); }}
            className="w-full flex items-center gap-2 px-3 py-2 mb-1 text-left active:opacity-70"
            style={{ background: "#FFF3E0", borderRadius: "10px" }}>
      <AlertTriangle size={18} color={C.orange} className="shrink-0" />
      <span className="text-xs" style={{ color: "#8A5A00" }}>
        Saved on this device, but auto-save is unavailable. Tap to back up your work orders.
      </span>
    </button>
  );

  if (loading) {
    return (
      <div className="ios min-h-screen flex items-center justify-center" style={{ background: C.bg }}>
        <style>{fontStyles}</style>
        <div className="text-sm" style={{ color: C.secondary }}>Loading…</div>
      </div>
    );
  }

  const isMaint = formType === "maint";

  // ---------- BACKUP / RESTORE ----------
  if (view === "backup") {
    return (
      <div className="ios min-h-screen pb-12" style={{ background: C.bg }}>
        <style>{fontStyles}</style>
        <NavBar title="Backup & Restore" back={() => setView("list")} />
        <div className="max-w-2xl mx-auto px-4">
          <p className="text-sm px-1 pt-5" style={{ color: C.secondary }}>
            Your {orders.length} work order{orders.length === 1 ? "" : "s"} are saved on this device. To keep a copy you can restore anytime, copy the backup below and paste it somewhere safe (Notes, email to yourself, etc.).
          </p>

          <SectionHeader>Backup</SectionHeader>
          <BigButton onClick={copyBackup} color={copied ? C.green : C.tint}>
            <span className="inline-flex items-center gap-1.5">
              {copied ? <><Check size={18} /> Copied</> : <><Copy size={18} /> Copy Backup</>}
            </span>
          </BigButton>

          <SectionHeader>Restore</SectionHeader>
          <TextArea rows={6} value={importText} onChange={(e) => setImportText(e.target.value)}
                    placeholder="Paste a backup here to restore your work orders…" />
          {error && (
            <div className="text-sm font-medium text-center mt-3" style={{ color: C.destructive }}>{error}</div>
          )}
          <div className="mt-3">
            <GrayButton onClick={restoreBackup}>Restore From Backup</GrayButton>
          </div>
        </div>
      </div>
    );
  }

  // ---------- LIST ----------
  if (view === "list") {
    const shown = orders.filter((o) => filter === "all" || o.type === filter);
    return (
      <div className="ios min-h-screen pb-10" style={{ background: C.bg }}>
        <style>{fontStyles}</style>
        <div className="max-w-2xl mx-auto px-4 pt-8">
          <div className="flex items-center gap-4">
            <AppIcon size={60} />
            <div>
              <h1 className="text-3xl font-bold tracking-tight leading-tight" style={{ color: C.label }}>Work Orders</h1>
              <div className="text-sm" style={{ color: C.secondary }}>Atlas Lift Sales</div>
            </div>
          </div>

          <div className="mt-5"><StorageBanner /></div>

          <div className="grid grid-cols-2 gap-3 mt-2">
            <button onClick={() => startNew("repair")}
                    className="flex flex-col items-start gap-2 p-4 active:opacity-70 text-left"
                    style={{ background: C.card, borderRadius: "16px", boxShadow: "0 1px 2px rgba(0,0,0,0.04)" }}>
              <span className="flex items-center justify-center" style={{ width: "36px", height: "36px", borderRadius: "10px", background: C.tint }}>
                <Wrench size={20} color="#FFF" />
              </span>
              <span className="font-semibold text-base leading-tight" style={{ color: C.label }}>New Repair</span>
              <span className="text-xs -mt-1.5" style={{ color: C.secondary }}>Work order</span>
            </button>
            <button onClick={() => startNew("maint")}
                    className="flex flex-col items-start gap-2 p-4 active:opacity-70 text-left"
                    style={{ background: C.card, borderRadius: "16px", boxShadow: "0 1px 2px rgba(0,0,0,0.04)" }}>
              <span className="flex items-center justify-center" style={{ width: "36px", height: "36px", borderRadius: "10px", background: "#1C1C1E" }}>
                <ClipboardList size={20} color="#FFF" />
              </span>
              <span className="font-semibold text-base leading-tight" style={{ color: C.label }}>New Maintenance</span>
              <span className="text-xs -mt-1.5" style={{ color: C.secondary }}>Work order</span>
            </button>
          </div>

          <div className="flex mt-6 p-0.5" style={{ background: "#E3E3E8", borderRadius: "9px" }}>
            {[["all", "All"], ["repair", "Repair"], ["maint", "Maintenance"]].map(([k, lbl]) => (
              <button key={k} onClick={() => setFilter(k)}
                      className="flex-1 text-sm font-medium py-1.5"
                      style={{
                        borderRadius: "7px",
                        background: filter === k ? "#FFF" : "transparent",
                        color: C.label,
                        boxShadow: filter === k ? "0 1px 3px rgba(0,0,0,0.12)" : "none",
                      }}>
                {lbl}
              </button>
            ))}
          </div>

          <SectionHeader>Recent</SectionHeader>
          {shown.length === 0 ? (
            <div className="p-8 text-center" style={{ background: C.card, borderRadius: "12px" }}>
              <div className="font-semibold mb-1" style={{ color: C.label }}>No work orders</div>
              <div className="text-sm" style={{ color: C.secondary }}>Tap New Repair or New Maintenance to get started.</div>
            </div>
          ) : (
            <div className="overflow-hidden" style={{ background: C.card, borderRadius: "12px" }}>
              {shown.map((o, i) => (
                <button key={o.id} onClick={() => openOrder(o.id)}
                        className="w-full text-left px-4 active:opacity-60"
                        style={{ borderBottom: i === shown.length - 1 ? "none" : `0.5px solid ${C.sep}` }}>
                  <div className="flex items-center gap-3 py-3">
                    <span className="flex items-center justify-center shrink-0"
                          style={{ width: "34px", height: "34px", borderRadius: "9px", background: o.type === "maint" ? "#1C1C1E" : C.tint }}>
                      {o.type === "maint" ? <ClipboardList size={18} color="#FFF" /> : <Wrench size={18} color="#FFF" />}
                    </span>
                    <div className="flex-1 min-w-0">
                      <div className="font-semibold text-base truncate" style={{ color: C.label }}>{o.customer}</div>
                      <div className="text-sm" style={{ color: C.secondary }}>{orderLabel(o)} · {fmtDate(o.createdAt)}</div>
                    </div>
                    <StatusPill status={o.status} />
                    <ChevronRight size={18} color={C.tertiary} />
                  </div>
                </button>
              ))}
            </div>
          )}

          {orders.length > 0 && (
            <button onClick={() => { setError(""); setImportText(""); setView("backup"); }}
                    className="w-full text-center text-sm font-medium py-4 mt-3" style={{ color: C.tint }}>
              Backup & Restore
            </button>
          )}
        </div>
      </div>
    );
  }

  // ---------- FORM ----------
  if (view === "form") {
    return (
      <div className="ios min-h-screen pb-12" style={{ background: C.bg }}>
        <style>{fontStyles}</style>
        <NavBar title={editingId && current ? "Edit " + orderLabel(current) : (isMaint ? "New Maintenance" : "New Repair")}
                back={() => setView(editingId ? "detail" : "list")} />
        <div className="max-w-2xl mx-auto px-4">

          <SectionHeader>Customer</SectionHeader>
          <div className="space-y-3">
            <div><FieldLabel>Company *</FieldLabel><TextInput value={form.customer} onChange={set("customer")} /></div>
            <div><FieldLabel>Address</FieldLabel><TextInput value={form.address} onChange={set("address")} /></div>
            <div className="grid grid-cols-2 gap-3">
              <div><FieldLabel>Phone contact</FieldLabel><TextInput value={form.phone} onChange={set("phone")} inputMode="tel" /></div>
              <div><FieldLabel>P.O. #</FieldLabel><TextInput value={form.po} onChange={set("po")} /></div>
            </div>
            {!isMaint && (
              <div><FieldLabel>Special instructions</FieldLabel><TextInput value={form.specialInstructions} onChange={set("specialInstructions")} /></div>
            )}
          </div>

          <SectionHeader>Forklift</SectionHeader>
          <div className="grid grid-cols-2 gap-3">
            <div><FieldLabel>Make</FieldLabel><TextInput value={form.make} onChange={set("make")} placeholder="Toyota" /></div>
            <div><FieldLabel>Model</FieldLabel><TextInput value={form.model} onChange={set("model")} placeholder="8FGU25" /></div>
            <div><FieldLabel>Serial #</FieldLabel><TextInput value={form.serial} onChange={set("serial")} /></div>
            <div><FieldLabel>Unit #</FieldLabel><TextInput value={form.unit} onChange={set("unit")} /></div>
            <div><FieldLabel>Hr. meter</FieldLabel><TextInput value={form.hourMeter} onChange={set("hourMeter")} inputMode="numeric" placeholder="Hrs" /></div>
            <div><FieldLabel>Tech.</FieldLabel><TextInput value={form.tech} onChange={set("tech")} placeholder="Your name" /></div>
          </div>

          {isMaint && (
            <>
              <SectionHeader>Options</SectionHeader>
              <div className="overflow-hidden" style={{ background: C.card, borderRadius: "12px" }}>
                <div className="flex items-center justify-between px-4 py-2" style={{ borderBottom: `0.5px solid ${C.sep}` }}>
                  <span className="text-base" style={{ color: C.label }}>Written estimate request</span>
                  <IOSSwitch value={!!form.estimateRequest} onChange={(v) => setForm({ ...form, estimateRequest: v })} />
                </div>
                <div className="flex items-center justify-between px-4 py-2">
                  <span className="text-base" style={{ color: C.label }}>Repairs schedule</span>
                  <IOSSwitch value={!!form.repairsSchedule} onChange={(v) => setForm({ ...form, repairsSchedule: v })} />
                </div>
              </div>
            </>
          )}

          {!isMaint && (
            <>
              <SectionHeader>Repair Description</SectionHeader>
              <TextArea value={form.repairDescription} onChange={set("repairDescription")} rows={6}
                        placeholder="Describe the trouble found and the repair performed…" />
            </>
          )}

          {isMaint && (
            <>
              <SectionHeader>Inspection Checklist</SectionHeader>
              <div className="text-xs px-1 pb-2" style={{ color: C.secondary }}>
                OK · NW (needs work) · CA (corrective action)
              </div>
              <div className="space-y-3">
                {CHECKLIST.map((sec) => {
                  const done = sec.items.filter((it) => form.checks[sec.key + "|" + it]).length;
                  const open = openSection === sec.key;
                  return (
                    <div key={sec.key} className="overflow-hidden" style={{ background: C.card, borderRadius: "12px" }}>
                      <button onClick={() => setOpenSection(open ? "" : sec.key)}
                              className="w-full flex items-center justify-between px-4 py-3 active:opacity-60">
                        <span className="font-semibold text-base" style={{ color: C.label }}>{sec.title}</span>
                        <span className="flex items-center gap-1 text-sm" style={{ color: done === sec.items.length ? C.green : C.secondary }}>
                          {done === sec.items.length && <CheckCircle2 size={16} color={C.green} />}
                          {done}/{sec.items.length}
                          <ChevronRight size={16} color={C.tertiary} style={{ transform: open ? "rotate(90deg)" : "none" }} />
                        </span>
                      </button>
                      {open && (
                        <div style={{ borderTop: `0.5px solid ${C.sep}` }}>
                          <div className="px-4 py-2.5" style={{ borderBottom: `0.5px solid ${C.sep}` }}>
                            <button onClick={() => markSectionOK(sec)} className="text-sm font-medium" style={{ color: C.tint }}>
                              Mark remaining items OK
                            </button>
                          </div>
                          {sec.items.map((it, idx) => {
                            const val = form.checks[sec.key + "|" + it];
                            return (
                              <div key={it} className="flex items-center justify-between gap-2 px-4 py-2"
                                   style={{ borderBottom: idx === sec.items.length - 1 ? "none" : `0.5px solid ${C.sep}` }}>
                                <span className="text-sm flex-1" style={{ color: C.label }}>{it}</span>
                                <div className="flex p-0.5 shrink-0" style={{ background: "#E3E3E8", borderRadius: "8px" }}>
                                  {RATINGS.map((r) => (
                                    <button key={r} onClick={() => setCheckTo(sec.key, it, r)}
                                            className="text-xs font-semibold px-2.5 py-1"
                                            style={{
                                              borderRadius: "6px",
                                              background: val === r ? ratingColor[r] : "transparent",
                                              color: val === r ? "#FFF" : C.secondary,
                                            }}>
                                      {r}
                                    </button>
                                  ))}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              <SectionHeader>Recommended Repairs</SectionHeader>
              <TextArea value={form.recommendedRepairs} onChange={set("recommendedRepairs")} rows={4}
                        placeholder="Repairs to recommend to the customer…" />
            </>
          )}

          <div className="flex items-end justify-between">
            <SectionHeader>Parts</SectionHeader>
            <button onClick={addPart} className="flex items-center gap-1 text-sm font-medium pb-2 pr-1 active:opacity-60" style={{ color: C.tint }}>
              <Plus size={16} strokeWidth={2.5} /> Add part
            </button>
          </div>
          {form.parts.length === 0 && (
            <div className="text-sm px-1" style={{ color: C.secondary }}>No parts added.</div>
          )}
          <div className="space-y-2">
            {form.parts.map((p, i) => (
              <div key={i} className="flex gap-2 items-center">
                <input value={p.qty} onChange={(e) => setPart(i, "qty", e.target.value)} placeholder="Qty" inputMode="numeric"
                       className="w-14 text-base text-center py-2.5"
                       style={{ background: C.card, borderRadius: "10px", border: `1px solid ${C.sep}`, color: C.label }} />
                <input value={p.name} onChange={(e) => setPart(i, "name", e.target.value)} placeholder="Part / description"
                       className="flex-1 text-base px-3.5 py-2.5"
                       style={{ background: C.card, borderRadius: "10px", border: `1px solid ${C.sep}`, color: C.label }} />
                <button onClick={() => removePart(i)} className="p-1 active:opacity-50">
                  <Trash2 size={18} color={C.destructive} />
                </button>
              </div>
            ))}
          </div>

          {error && (
            <div className="text-sm font-medium text-center mt-4" style={{ color: C.destructive }}>{error}</div>
          )}

          <div className="space-y-3 mt-8">
            <BigButton onClick={() => save(true)}>Save & Get Signatures</BigButton>
            <GrayButton onClick={() => save(false)}>Save as Draft</GrayButton>
          </div>
        </div>
      </div>
    );
  }

  // ---------- SIGN ----------
  if (view === "sign" && current) {
    return (
      <div className="ios min-h-screen pb-12" style={{ background: C.bg }}>
        <style>{fontStyles}</style>
        <NavBar title={"Sign-Off · " + orderLabel(current)} back={() => setView("detail")} />
        <div className="max-w-2xl mx-auto px-4">
          <p className="text-sm px-1 pt-5" style={{ color: C.secondary }}>
            By signing, the customer authorizes and confirms the work described on this order at all prevailing rates.
          </p>

          <SectionHeader>Service Technician (optional)</SectionHeader>
          <SignaturePad onChange={setTechSig} height={120} />

          <SectionHeader>Customer</SectionHeader>
          <SignaturePad onChange={setCustSig} height={160} />
          <div className="mt-3">
            <FieldLabel>Printed name</FieldLabel>
            <TextInput value={signerName} onChange={(e) => setSignerName(e.target.value)} placeholder="Customer's name" />
          </div>

          {error && (
            <div className="text-sm font-medium text-center mt-4" style={{ color: C.destructive }}>{error}</div>
          )}

          <div className="mt-6">
            <BigButton onClick={completeSigning} color={C.green}>Complete Work Order</BigButton>
          </div>
        </div>
      </div>
    );
  }

  // ---------- DETAIL ----------
  if (view === "detail" && current) {
    const maint = current.type === "maint";
    const rows = [
      ["Company", current.customer],
      ["Address", current.address],
      ["Phone", current.phone],
      ["P.O. #", current.po],
      !maint && ["Instructions", current.specialInstructions],
      ["Forklift", [current.make, current.model].filter(Boolean).join(" ")],
      ["Serial #", current.serial],
      ["Unit #", current.unit],
      ["Hr. meter", current.hourMeter],
      ["Tech.", current.tech],
      maint && ["Estimate request", current.estimateRequest ? "Yes" : ""],
      maint && ["Repairs schedule", current.repairsSchedule ? "Yes" : ""],
    ].filter((r) => r && r[1]);

    return (
      <div className="ios min-h-screen pb-12" style={{ background: C.bg }}>
        <style>{fontStyles}</style>
        <NavBar title={orderLabel(current)} back={() => setView("list")} />
        <div className="max-w-2xl mx-auto px-4">
          <div className="flex items-center gap-3 pt-6 px-1">
            <span className="flex items-center justify-center shrink-0"
                  style={{ width: "44px", height: "44px", borderRadius: "11px", background: maint ? "#1C1C1E" : C.tint }}>
              {maint ? <ClipboardList size={24} color="#FFF" /> : <Wrench size={24} color="#FFF" />}
            </span>
            <div className="flex-1">
              <div className="text-xl font-bold tracking-tight" style={{ color: C.label }}>{current.customer}</div>
              <div className="text-sm" style={{ color: C.secondary }}>
                {maint ? "Maintenance" : "Repair"} · {fmtDate(current.createdAt)}
              </div>
            </div>
            <StatusPill status={current.status} />
          </div>

          <SectionHeader>Details</SectionHeader>
          <div className="overflow-hidden" style={{ background: C.card, borderRadius: "12px" }}>
            {rows.map(([k, v], i) => (
              <div key={k} className="flex justify-between gap-4 px-4 py-2.5"
                   style={{ borderBottom: i === rows.length - 1 ? "none" : `0.5px solid ${C.sep}` }}>
                <span className="text-base shrink-0" style={{ color: C.label }}>{k}</span>
                <span className="text-base text-right" style={{ color: C.secondary }}>{v}</span>
              </div>
            ))}
          </div>

          {!maint && current.repairDescription && (
            <>
              <SectionHeader>Repair Description</SectionHeader>
              <div style={{ background: C.card, borderRadius: "12px" }}>
                <p className="px-4 py-3 text-base whitespace-pre-wrap" style={{ color: C.label }}>{current.repairDescription}</p>
              </div>
            </>
          )}

          {maint && CHECKLIST.map((sec) => {
            const marked = sec.items
              .map((it) => [it, current.checks?.[sec.key + "|" + it]])
              .filter(([, v]) => v);
            if (marked.length === 0) return null;
            return (
              <div key={sec.key}>
                <SectionHeader>{sec.title}</SectionHeader>
                <div style={{ background: C.card, borderRadius: "12px" }}>
                  <div className="flex flex-wrap gap-1.5 p-3">
                    {marked.map(([it, v]) => (
                      <span key={it} className="text-xs font-medium px-2 py-1"
                            style={{ borderRadius: "20px", background: ratingColor[v] + "1A", color: ratingColor[v] }}>
                        {it} · {v}
                      </span>
                    ))}
                  </div>
                </div>
              </div>
            );
          })}

          {maint && current.recommendedRepairs && (
            <>
              <SectionHeader>Recommended Repairs</SectionHeader>
              <div style={{ background: C.card, borderRadius: "12px" }}>
                <p className="px-4 py-3 text-base whitespace-pre-wrap" style={{ color: C.label }}>{current.recommendedRepairs}</p>
              </div>
            </>
          )}

          {current.parts && current.parts.filter((p) => p.name).length > 0 && (
            <>
              <SectionHeader>Parts</SectionHeader>
              <div className="overflow-hidden" style={{ background: C.card, borderRadius: "12px" }}>
                {current.parts.filter((p) => p.name).map((p, i, arr) => (
                  <div key={i} className="px-4 py-2.5 text-base"
                       style={{ color: C.label, borderBottom: i === arr.length - 1 ? "none" : `0.5px solid ${C.sep}` }}>
                    {p.qty || 1} × {p.name}
                  </div>
                ))}
              </div>
            </>
          )}

          {current.status === "signed" && (
            <>
              <SectionHeader>Sign-Off</SectionHeader>
              <div style={{ background: C.card, borderRadius: "12px" }}>
                <div className="flex flex-wrap gap-6 p-4">
                  {current.technicianSignature && (
                    <div>
                      <img src={current.technicianSignature} alt="Technician signature" className="max-h-14" style={{ borderRadius: "6px" }} />
                      <div className="text-xs mt-1" style={{ color: C.secondary }}>Service technician</div>
                    </div>
                  )}
                  {current.signature && (
                    <div>
                      <img src={current.signature} alt="Customer signature" className="max-h-14" style={{ borderRadius: "6px" }} />
                      <div className="text-xs mt-1" style={{ color: C.secondary }}>
                        {current.signerName ? current.signerName + " · " : ""}Customer · {fmtDate(current.signedAt)}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </>
          )}

          <div className="space-y-3 mt-6">
            {current.status === "signed" ? (
              <>
                <BigButton onClick={savePDF} color={C.tint}>
                  Save as PDF
                </BigButton>
                <div className="text-xs text-center px-2" style={{ color: C.secondary }}>
                  Opens a printable copy — choose Share or "Save to Files" to keep the PDF, then upload it in QuickBooks.
                </div>
                {qb.state === "error" && qb.msg && (
                  <div className="text-sm font-medium text-center px-2" style={{ color: C.destructive }}>
                    {qb.msg}
                  </div>
                )}
              </>
            ) : (
              <>
                <BigButton onClick={() => { setCustSig(null); setTechSig(null); setSignerName(""); setError(""); setView("sign"); }}>
                  <span className="inline-flex items-center gap-1.5"><PenLine size={18} /> Get Signatures</span>
                </BigButton>
                <GrayButton onClick={editDraft}>Edit Work Order</GrayButton>
              </>
            )}
            <button onClick={removeOrder}
                    className="w-full text-center text-base font-semibold py-3.5 active:opacity-70"
                    style={{ background: C.card, color: C.destructive, borderRadius: "14px" }}>
              Delete Work Order
            </button>
          </div>
        </div>
      </div>
    );
  }

  return null;
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(AtlasServiceOrders));
</script>
</body>
</html>
